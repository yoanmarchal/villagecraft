    <!--
      Écran de chargement : en ligne, pour s'afficher avant même le
      téléchargement du JavaScript, puis retiré en fondu par hideAppLoader()
      (src/loader.ts) une fois la première image du village dessinée.
      Crépuscule sur la silhouette d'un village fortifié dont les fenêtres
      s'allument une à une. Toutes les animations ne touchent que transform
      et opacity, sur des éléments HTML (pas SVG) : le navigateur les joue
      hors du fil principal, elles continuent pendant que la construction du
      village l'occupe. Silhouette et fenêtres sont générées (coordonnées
      dans un viewBox de 960 × 240, fenêtres en % de ce cadre).
    -->
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        overflow: hidden;
        background: linear-gradient(
          180deg,
          #0b1124 0%,
          #18244a 38%,
          #3d4572 62%,
          #9a6f7a 80%,
          #e2a77c 94%,
          #f0c28f 100%
        );
        font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
        color: #f3e5cc;
        transition: opacity 0.7s ease;
      }
      #app-loader[data-state='done'] {
        opacity: 0;
        pointer-events: none;
      }
      .app-loader__moon {
        position: absolute;
        top: 12%;
        right: 16%;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: radial-gradient(circle at 38% 36%, #fffaf0 0%, #f1e3c4 62%, #d9c7a2 100%);
        box-shadow:
          0 0 30px 8px rgba(255, 236, 200, 0.25),
          0 0 90px 30px rgba(255, 220, 170, 0.12);
      }
      .app-loader__stars i {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: #fff8e8;
        opacity: 0.25;
        animation: app-loader-twinkle 3.2s ease-in-out infinite;
        will-change: opacity;
      }
      @keyframes app-loader-twinkle {
        50% {
          opacity: 0.95;
        }
      }
      /* Collines lointaines, puis silhouette du bourg. */
      .app-loader__hills {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 38vh;
        width: 100%;
      }
      .app-loader__town {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: max(100vw, 760px);
        transform: translateX(-50%);
      }
      .app-loader__skyline {
        position: relative;
        aspect-ratio: 960 / 240;
        width: min(1080px, 100%);
        margin: 0 auto;
      }
      .app-loader__skyline svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .app-loader__skyline i,
      .app-loader__skyline b {
        position: absolute;
        background: #ffc874;
        box-shadow: 0 0 8px 2px rgba(255, 170, 80, 0.55);
        opacity: 0.06;
        animation: app-loader-lamp 5.2s ease-in-out infinite both;
        will-change: opacity;
      }
      .app-loader__skyline b {
        border-radius: 40% 40% 0 0 / 30% 30% 0 0;
        background: linear-gradient(180deg, #ffb35e, #e07a36);
        box-shadow: 0 0 18px 4px rgba(255, 150, 70, 0.45);
        animation: none;
        opacity: 0.8;
      }
      @keyframes app-loader-lamp {
        0%,
        6% {
          opacity: 0.06;
        }
        12%,
        78% {
          opacity: 1;
        }
        92%,
        100% {
          opacity: 0.06;
        }
      }
      /* Bande de sol sous la silhouette : elle déborde des deux côtés sur les écrans larges. */
      .app-loader__ground {
        height: 4vh;
        background: #0f1428;
        margin-top: -1px;
      }
      /* Brume chaude à l'horizon, devant les collines. */
      .app-loader__haze {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 30vh;
        background: radial-gradient(ellipse 70% 100% at 50% 100%, rgba(255, 170, 110, 0.18), transparent 70%);
        pointer-events: none;
      }
      .app-loader__title {
        position: absolute;
        left: 0;
        right: 0;
        top: 24%;
        display: grid;
        justify-items: center;
        gap: 14px;
        text-align: center;
        padding: 0 16px;
      }
      .app-loader__name {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 0;
        font-size: clamp(26px, 5vw, 46px);
        font-weight: 400;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        text-shadow: 0 2px 18px rgba(255, 200, 140, 0.25);
        padding-left: 0.28em; /* compense l'espacement de la dernière lettre */
      }
      .app-loader__name::before,
      .app-loader__name::after {
        content: '';
        width: clamp(28px, 8vw, 90px);
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(243, 229, 204, 0.7));
      }
      .app-loader__name::after {
        background: linear-gradient(90deg, rgba(243, 229, 204, 0.7), transparent);
      }
      /* Messages qui se relaient, en fondu. */
      .app-loader__steps {
        position: relative;
        height: 1.4em;
        width: 260px;
        font-size: 15px;
        font-style: italic;
        letter-spacing: 0.06em;
        color: rgba(243, 229, 204, 0.78);
      }
      .app-loader__steps span {
        position: absolute;
        inset: 0;
        opacity: 0;
        animation: app-loader-step 8s ease-in-out infinite both;
        will-change: opacity, transform;
      }
      .app-loader__steps span:nth-child(1) {
        animation-delay: 0s;
      }
      .app-loader__steps span:nth-child(2) {
        animation-delay: 2s;
      }
      .app-loader__steps span:nth-child(3) {
        animation-delay: 4s;
      }
      .app-loader__steps span:nth-child(4) {
        animation-delay: 6s;
      }
      @keyframes app-loader-step {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        5%,
        21% {
          opacity: 1;
          transform: translateY(0);
        }
        26%,
        100% {
          opacity: 0;
          transform: translateY(-6px);
        }
      }
      /* Barre de progression indéterminée, très fine. */
      .app-loader__bar {
        position: relative;
        width: 180px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(243, 229, 204, 0.16);
      }
      .app-loader__bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 60px;
        background: linear-gradient(90deg, transparent, #ffd49a, transparent);
        animation: app-loader-sweep 1.8s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes app-loader-sweep {
        0% {
          transform: translateX(-60px);
        }
        100% {
          transform: translateX(180px);
        }
      }
      /* Écran étroit : titre resserré, sans filets (ils débordaient). */
      @media (max-width: 520px) {
        .app-loader__name {
          letter-spacing: 0.16em;
          padding-left: 0.16em;
          font-size: 28px;
        }
        .app-loader__name::before,
        .app-loader__name::after {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader,
        #app-loader * {
          transition: none !important;
        }
        .app-loader__stars i,
        .app-loader__skyline i,
        .app-loader__bar::after {
          animation: none;
        }
        .app-loader__skyline i {
          opacity: 1;
        }
        .app-loader__steps span {
          animation: none;
        }
        .app-loader__steps span:first-child {
          opacity: 1;
        }
      }
    </style>
